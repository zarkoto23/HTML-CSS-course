<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <main>
      <section class="form-section">
        <h2>GET IN TOUCH</h2>

        <form action="#">
            <div class="row">
          <input id="name" type="text" name="name" placeholder="Name"/>

          <input id="email" type="text" name="email" placeholder="Email"/>
          </div>

          <textarea id="message" rows="1" name="message" placeholder="Message"></textarea>
        </form>

        <button>SEND</button>

        <div class="footer">
        <p>&copy; Untitled.All rights reserver</p>
        <p>Design: <a href="">HTML & CSS</a></p>
        </div>
      </section>

      <section class="icon-section">
        <h2>FOLLOW</h2>
        <ul>
          <li><i class="fa-brands fa-x-twitter"></i></li>
          <li><i class="fa-brands fa-facebook-f"></i></li>
          <li><i class="fa-brands fa-instagram"></i></li>
          <li><i class="fa-brands fa-github"></i></li>
          <li><i class="fa-brands fa-linkedin-in"></i></li>
          <li><i class="fa-brands fa-pinterest-p"></i></li>
          <li><i class="fa-brands fa-threads"></i></li>
          <li><i class="fa-solid fa-phone"></i></li>
          <li><i class="fa-solid fa-envelope"></i></li>
        </ul>
      </section>
    </main>
  </body>
</html>
